<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080">
  <defs>
    <radialGradient id="glowR" cx="0" cy="0" r="1" gradientTransform="translate(1510 830) scale(700 560)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e8d53" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#0f5e37" stop-opacity=".22"/>
      <stop offset="1" stop-color="#05110a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0" cy="0" r="1" gradientTransform="translate(1550 90) scale(560 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7b5cff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(250 1010) scale(620 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffb347" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050b08"/>
      <stop offset=".45" stop-color="#08150e"/>
      <stop offset="1" stop-color="#04100a"/>
    </linearGradient>
    <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2fbf68" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0b4427" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="geckoG" x1="1380" y1="450" x2="1800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#74f0a0" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#1f9d55" stop-opacity=".42"/>
      <stop offset="1" stop-color="#0a4b2b" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="vig" cx="0" cy="0" r="1" gradientTransform="translate(820 520) scale(1100 720)" gradientUnits="userSpaceOnUse">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".72"/>
    </radialGradient>
    <filter id="b1" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="b2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="b3" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
    <g id="monstera">
      <path d="M0 0C-70-90-58-210 28-292 96-355 190-372 268-340 250-300 258-262 292-232 246-224 214-198 202-160 250-150 286-116 298-70 250-78 212-62 190-26 222-12 244 14 250 46 196 18 142 20 96 44 60 14 30 8 0 0Z" fill="url(#leafG)"/>
      <path d="M0 0 205-248M72-26 196-126M128-8 228-78M28-92 176-206" stroke="#0a3a22" stroke-opacity=".35" stroke-width="3" fill="none"/>
      <ellipse cx="160" cy="-170" rx="34" ry="16" transform="rotate(-42 160 -170)" fill="#04150c" fill-opacity=".35"/>
      <ellipse cx="118" cy="-72" rx="30" ry="14" transform="rotate(-28 118 -72)" fill="#04150c" fill-opacity=".3"/>
    </g>
    <g id="canna">
      <path d="M0 0C-16-64-10-132 18-190 34-224 60-252 84-274 74-236 78-196 92-160 112-196 138-222 172-240 138-198 120-154 116-112 146-136 176-148 208-150 164-118 134-78 118-36 108-12 100-6 84 4 60-18 30-14 0 0Z" fill="#1f7a45" fill-opacity=".28"/>
      <path d="M84 4 84-268M84-160 172-238M84-112 206-148M84-70 160-132" stroke="#0b3a20" stroke-opacity=".3" stroke-width="2" fill="none"/>
    </g>
    <g id="geckoArt">
      <path d="M0 150C-110 150-210 200-290 140-355 90-320 0-240 18c55 12 76 62 44 96" stroke="url(#geckoG)" stroke-width="34" stroke-linecap="round" fill="none"/>
      <path d="M-20 190c-20 70-90 100-160 88M110 200c22 66 96 96 168 76M-60 90c-50-30-100-24-140 10M175 96c50-40 110-30 150 4" stroke="url(#geckoG)" stroke-width="26" stroke-linecap="round" fill="none"/>
      <ellipse cx="60" cy="160" rx="150" ry="78" transform="rotate(-8 60 160)" fill="url(#geckoG)"/>
      <ellipse cx="60" cy="192" rx="115" ry="42" transform="rotate(-8 60 192)" fill="#b6ffcf" fill-opacity=".13"/>
      <ellipse cx="228" cy="118" rx="74" ry="60" transform="rotate(-12 228 118)" fill="url(#geckoG)"/>
      <path d="M170 160c40 34 96 34 140 2" stroke="#052b18" stroke-opacity=".35" stroke-width="5" stroke-linecap="round" fill="none"/>
      <circle cx="242" cy="102" r="17" fill="#03100a"/>
      <circle cx="247" cy="96" r="6" fill="#dfffe9"/>
      <circle cx="242" cy="102" r="34" fill="#9bff5a" fill-opacity=".12" filter="url(#b2)"/>
      <circle cx="18" cy="128" r="10" fill="#052b18" fill-opacity=".3"/>
      <circle cx="78" cy="142" r="8" fill="#052b18" fill-opacity=".26"/>
      <circle cx="126" cy="122" r="7" fill="#052b18" fill-opacity=".22"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#glowR)"/>
  <rect width="1920" height="1080" fill="url(#glowV)"/>
  <rect width="1920" height="1080" fill="url(#glowA)"/>

  <!-- haze -->
  <g filter="url(#b1)" opacity=".5">
    <ellipse cx="1630" cy="880" rx="330" ry="120" fill="#27c46d" fill-opacity=".18"/>
    <ellipse cx="1450" cy="300" rx="260" ry="100" fill="#7b5cff" fill-opacity=".12"/>
    <ellipse cx="1780" cy="620" rx="200" ry="70" fill="#9bff5a" fill-opacity=".1"/>
  </g>

  <!-- terrarium glass arcs -->
  <g fill="none" stroke="#bfffd6" stroke-opacity=".07" stroke-width="3">
    <path d="M1220 1080c0-420 170-760 430-900"/>
    <path d="M1320 1080c0-380 150-690 380-820"/>
    <path d="M1120 1080c0-460 190-830 480-980"/>
    <ellipse cx="1650" cy="185" rx="17" ry="7"/>
  </g>

  <!-- background foliage -->
  <g opacity=".55">
    <use href="#monstera" transform="translate(1740 1080) rotate(-16) scale(1.55)"/>
    <use href="#monstera" transform="translate(1980 260) rotate(126) scale(1.15)" opacity=".6"/>
    <use href="#monstera" transform="translate(80 1140) rotate(-8) scale(1.2)" opacity=".45"/>
    <use href="#canna" transform="translate(1420 1120) rotate(-28) scale(1.4)"/>
    <use href="#canna" transform="translate(1900 620) rotate(152) scale(1.1)" opacity=".7"/>
  </g>

  <!-- branch -->
  <path d="M1150 940c220-70 460-110 770-96" stroke="#2a1e13" stroke-opacity=".7" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M1150 940c220-70 460-110 770-96" stroke="#6d5239" stroke-opacity=".25" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- gecko -->
  <use href="#geckoArt" transform="translate(1500 690) rotate(-8) scale(1.05)" opacity=".9"/>

  <!-- spores -->
  <g fill="#c9ff5a">
    <circle cx="1420" cy="180" r="3" opacity=".7"/><circle cx="1610" cy="120" r="2.4" opacity=".55"/>
    <circle cx="1810" cy="260" r="2.8" opacity=".6"/><circle cx="1300" cy="420" r="2" opacity=".5"/>
    <circle cx="1720" cy="480" r="3.4" opacity=".5"/><circle cx="1880" cy="540" r="2.2" opacity=".45"/>
    <circle cx="1260" cy="760" r="2.6" opacity=".4"/><circle cx="1560" cy="1020" r="3" opacity=".4"/>
    <circle cx="1130" cy="240" r="1.8" opacity=".35"/><circle cx="900" cy="880" r="2" opacity=".25"/>
    <circle cx="640" cy="140" r="1.6" opacity=".24"/><circle cx="380" cy="700" r="1.8" opacity=".2"/>
  </g>
  <g fill="#ffb347" opacity=".5">
    <circle cx="1660" cy="380" r="2.4"/><circle cx="1330" cy="620" r="1.8"/><circle cx="1840" cy="810" r="2"/>
  </g>

  <!-- soft bokeh -->
  <g filter="url(#b3)" opacity=".35">
    <circle cx="1780" cy="150" r="16" fill="#9bff5a" fill-opacity=".18"/>
    <circle cx="1360" cy="920" r="22" fill="#7b5cff" fill-opacity=".14"/>
    <circle cx="1880" cy="700" r="14" fill="#ffb347" fill-opacity=".16"/>
  </g>

  <!-- vignette keeps the left side calm for text -->
  <rect width="1920" height="1080" fill="url(#vig)"/>
  <rect x="0" y="0" width="960" height="1080" fill="#030906" fill-opacity=".32"/>
</svg>
